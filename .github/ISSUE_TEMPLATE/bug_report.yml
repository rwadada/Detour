name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and help improve Detour!
  - type: input
    id: version
    attributes:
      label: Detour Version
      description: What version of Detour are you using? (Run `detour --version`)
      placeholder: e.g. 2.1.0
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - Homebrew (brew install detour)
        - npm / npx (@rwadada/detour)
        - Source checkout
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: target_env
    attributes:
      label: Target Environment (if applicable)
      description: e.g. iOS Simulator (iOS 18.0), Android Device (Pixel 7 / Android 14), macOS System Proxy
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue? Please provide step-by-step instructions.
      placeholder: |
        1. Run `detour start`
        2. Run `detour setup --target ios`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages if any)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant terminal output or dashboard logs.
      render: shell
