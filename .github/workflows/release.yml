name: Release

# Publishes the self-contained release tarball Homebrew (and anyone else)
# installs from — see scripts/build-release.mjs and issue #52. Triggered by
# pushing a `vX.Y.Z` tag matching package.json's version.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The CLI's own `engines.node` stays >=18 (esbuild targets node18,
          # and that's all end users need to *run* the release build) — but
          # building the dashboard SPA needs Vite 7, which requires Node
          # 20.19+/22.12+. Node 18 here also tripped npm's optional-deps bug
          # (npm/cli#4828), leaving native rollup/lightningcss bindings
          # unresolved and failing the build outright.
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # `npm ci` — and even a plain `npm install` reusing the committed
      # lockfile — hit npm's optional-dependencies bug on this runner
      # (npm/cli#4828): it fails to select the linux-x64-gnu native binding
      # for Rollup/lightningcss even though package-lock.json lists it
      # (`grep linux-x64-gnu package-lock.json` shows the entries are
      # there). The reliable fix is the one npm's own error message
      # suggests: install with no pre-existing lockfile/node_modules so npm
      # re-resolves optionals for the current platform from scratch, rather
      # than reusing a resolved tree it computed wrong. This CI-only
      # lockfile regeneration is never committed back.
      - run: npm install

      - name: Build release tarball
        run: |
          npm run build:release && exit 0
          echo "::warning::build:release failed — retrying with a from-scratch npm install (npm/cli#4828 workaround)"
          rm -rf node_modules web/node_modules package-lock.json
          npm install
          npm run build:release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tarball="release/detour-${version}.tar.gz"
          sha256="$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_STEP_SUMMARY"

          notes_file="$(mktemp)"
          {
            echo "sha256: \`$sha256\`"
            echo ""
            echo "Homebrew: \`brew install rwadada/detour/detour\` (bump \`Formula/detour.rb\` in [homebrew-detour](https://github.com/rwadada/homebrew-detour) to this version/sha256 first)."
          } > "$notes_file"

          gh release create "${GITHUB_REF_NAME}" "$tarball" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file "$notes_file"
