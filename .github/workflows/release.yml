name: Release

# Publishes the self-contained release tarball Homebrew (and anyone else)
# installs from — see scripts/build-release.mjs and issue #52. Triggered by
# pushing a `vX.Y.Z` tag matching package.json's version.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The CLI's own `engines.node` stays >=18 (esbuild targets node18,
          # and that's all end users need to *run* the release build) — but
          # building the dashboard SPA needs Vite 7, which requires Node
          # 20.19+/22.12+.
          node-version: 22

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # This runner has repeatedly hit npm's optional-dependencies bug
      # (npm/cli#4828: "Cannot find native binding" — Rollup/lightningcss's
      # linux-x64-gnu package doesn't get installed even though
      # package-lock.json lists it), across `npm ci`, `npm install`, with
      # and without actions/setup-node's cache, and even after a from-scratch
      # reinstall. Multiple reports trace this to a regression in npm 11's
      # workspace optional-dependency resolution; pin to 10.8.2, one of the
      # last versions before it, as the next attempt.
      - run: npm install -g npm@10.8.2
      - run: npm -v
      - run: npm install

      - name: Diagnose optional native deps
        run: |
          echo "--- @rollup/rollup-linux-* ---"
          ls web/node_modules/@rollup 2>&1 || true
          echo "--- lightningcss-linux-* ---"
          ls web/node_modules | grep lightningcss 2>&1 || true

      - name: Build release tarball
        run: npm run build:release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tarball="release/detour-${version}.tar.gz"
          sha256="$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_STEP_SUMMARY"

          notes_file="$(mktemp)"
          {
            echo "sha256: \`$sha256\`"
            echo ""
            echo "Homebrew: \`brew install rwadada/detour/detour\` (bump \`Formula/detour.rb\` in [homebrew-detour](https://github.com/rwadada/homebrew-detour) to this version/sha256 first)."
          } > "$notes_file"

          gh release create "${GITHUB_REF_NAME}" "$tarball" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file "$notes_file"
