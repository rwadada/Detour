name: Release (manual tag)

# Manual fallback: pushing a `vX.Y.Z` tag by hand (e.g. a hotfix release, or
# re-publishing after a failed run) builds and publishes the release asset
# the same way release-please.yml's own release does. See
# build-and-publish-release.yml for the actual steps — kept in one place so
# fixing a CI-runner quirk there doesn't need fixing twice.
#
# release-please.yml is the normal path: merging its version-bump PR tags
# it and creates the GitHub Release itself, then calls the same reusable
# workflow. This one only fires for a tag *not* created that way — a tag
# push from a GITHUB_TOKEN-authenticated action (like release-please's own)
# doesn't trigger other workflows, so there's no double-run to worry about.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-publish:
    uses: ./.github/workflows/build-and-publish-release.yml
    with:
      tag: ${{ github.ref_name }}
