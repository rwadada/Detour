name: PR

# Runs the full local `verify` pipeline (format, typecheck, lint, FSD/dep-cruise
# boundaries, dup-check, unit+coverage, dashboard tests, CLI e2e) against every
# push and pull request — see issue #53.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancels a still-running verify for an earlier push to the same branch/PR
# once a newer one lands — its result is moot anyway, and this suite runs
# a genuinely slow e2e pass, so letting superseded runs pile up wastes real
# minutes rather than a few seconds.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches release.yml: the CLI's own engines.node stays >=18, but
          # the dashboard workspace's Vite 7 needs 20.19+/22.12+. Pinned to
          # the exact floor of that range so a resolver change can't
          # silently pick an early-22.x that predates it.
          node-version: "22.12.0"
          cache: "npm"

      - run: npm ci

      - run: npm run verify

  # Deliberately its own job, not a step inside `verify` (issue #163): the
  # benchmark is timing-sensitive, so sharing a runner with the e2e suite
  # would have it measure that suite's CPU contention as much as the proxy.
  # Kept to the three short scenarios — a full run takes minutes.
  #
  # The gate compares each scenario against a direct, no-proxy request
  # measured on this same runner seconds apart, so it stays meaningful
  # despite GitHub runners varying in absolute speed from run to run. An
  # absolute req/s threshold would not.
  bench:
    # Waits on (but still runs on its own separate runner from, per the
    # comment above) `verify`: no point spending CI minutes benchmarking a
    # change that already failed correctness checks.
    needs: verify
    runs-on: ubuntu-latest
    # A bounded failure beats an unbounded one: this job drives real proxy
    # processes and real sockets, so a hang is a plausible failure mode, and
    # without a cap GitHub's 6-hour default leaves it sitting at "in
    # progress" with no readable log — which is exactly what happened on
    # this PR's first run. A full --quick run is well under two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - run: npm ci

      - run: npm run bench -- --quick --gate
