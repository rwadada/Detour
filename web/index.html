<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5eb3e8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Detour Dashboard</title>
    <script>
      // Applied synchronously, before first paint, so switching to light
      // mode (dark is the default palette — see src/app/index.css) never
      // flashes dark-then-light on load. Kept in sync with
      // src/shared/lib/theme.ts.
      (function () {
        if (localStorage.getItem('detour-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
